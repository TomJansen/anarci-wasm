[package]
name = "anarci-wasm"
version = "0.1.0"
edition = "2021"
description = "ANARCI antibody numbering compiled to WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustyhmmer = "0.1.4"

[patch.crates-io]
rustyhmmer = { path = "rustyhmmer" }

[profile.release]
opt-level = "s"
lto = true
